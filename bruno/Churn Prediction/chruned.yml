info:
  name: chruned
  type: http

http:
  method: POST
  url: http://127.0.0.1:8000/predict
  body:
    type: json
    data: |-
      {
          "CreditScore": 600.0,
          "Age": 35.0,
          "Tenure": 5.0,
          "Balance": 50000.0,
          "NumOfProducts": 2.0,
          "HasCrCard": 1.0,
